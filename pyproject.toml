[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sentrykit"
dynamic = ["version"]
description = "Lightweight, framework-agnostic authorization for Python web frameworks and agent tooling, built on AWS Cedar."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Namit Kewat", email = "namitkewat@gmail.com" }]
keywords = [
  "authorization", "authz", "cedar", "access-control", "rbac", "abac", "rebac",
  "fastapi", "flask", "mcp", "model-context-protocol", "pydantic-ai", "agents", "llm",
  "policy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  # No `License ::` classifier. PEP 639 forbids one beside the SPDX `license` expression
  # above, and PyPI rejects an upload carrying both. The expression is the licence.
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "cedarpy>=4.8,<5",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "typing-extensions>=4.10",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110", "starlette>=0.37"]
flask = ["flask>=3.0"]
mcp = ["mcp>=2,<3"]
pydantic-ai = ["pydantic-ai"]
web = ["sentrykit[fastapi,flask]"]
agents = ["sentrykit[mcp,pydantic-ai]"]
all = ["sentrykit[web,agents]"]

[project.scripts]
sentrykit = "sentrykit.cli:main"

# --- Plugin discovery groups ------------------------------------------------
# Third parties publish a `sentrykit-<name>` package registering here; built-ins
# register the same way. Format: name = "module:Class".
# Register each entry point WHEN its backend is built (do not leave dangling refs).
[project.entry-points."sentrykit.policy_sources"]
file = "sentrykit.stores.filesystem:FilesystemPolicySource"
pack = "sentrykit.policy.loader:PackPolicySource"

[project.entry-points."sentrykit.grant_stores"]
jsonfile = "sentrykit.stores.jsonfile:JsonFileGrantStore"
memory = "sentrykit.stores.memory:InMemoryGrantStore"

[project.entry-points."sentrykit.audit_sinks"]
jsonl = "sentrykit.stores.jsonl:JsonlAuditSink"
memory = "sentrykit.stores.memory:InMemoryAuditSink"

[project.entry-points."sentrykit.context_providers"]
fastapi = "sentrykit.integrations.fastapi:FastAPIProvider"
flask = "sentrykit.integrations.flask:FlaskProvider"
mcp = "sentrykit.integrations.mcp:MCPProvider"
pydantic-ai = "sentrykit.integrations.pydantic_ai:PydanticAIProvider"

# The documentation ships as release assets -- HTML, PDF, llms.txt and llms-full.txt --
# rather than as a hosted site, so that a reader always has the version they installed.
# Documentation therefore points at the releases page, which is where those assets are.
[project.urls]
Homepage = "https://github.com/namitkewat/sentrykit"
Documentation = "https://github.com/namitkewat/sentrykit/releases"
Source = "https://github.com/namitkewat/sentrykit"
Changelog = "https://github.com/namitkewat/sentrykit/blob/main/CHANGELOG.md"

# The version lives in the package, so `sentrykit.__version__` and the distribution metadata
# cannot drift apart.
[tool.hatch.version]
path = "src/sentrykit/__init__.py"

# Core metadata 2.4 rather than hatchling's default, which is currently 2.5. 2.5 is newer
# than anything `packaging` understands -- 25.0 knows up to 2.4 -- so a 2.5 artifact is
# refused by `twine check` and by every consumer that validates metadata, which made the
# wheel unpublishable regardless of what it contained. 2.4 is the version PEP 639 landed in,
# so `License-Expression` and `License-File` are carried either way and nothing is lost.
# Remove these two lines once `packaging` ships 2.5 support.
[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/sentrykit"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
# An sdist should carry what somebody needs to rebuild and test this package, and nothing
# that merely happens to be in the working tree. The builder's default is "everything git
# does not ignore", which is close but not the same rule: it does not read *nested* ignore
# files, and `.hypothesis/` is excluded from git only by a `.gitignore` that Hypothesis
# writes inside it. The result was 328 files of a local test-example cache shipped to every
# downstream consumer, which nothing would ever have reported.
#
# `tests/`, `docs/`, `dev-docs/` and `examples/` stay: a distributor rebuilding this should
# be able to run the suite, and the ADRs are the reasoning behind what they are packaging.
# What goes is caches, repository plumbing that means nothing outside a checkout, and
# `CLAUDE.md`, which is an operating guide for working *in* this repository rather than a
# part of what it distributes.
exclude = [
  ".hypothesis",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  ".github",
  ".gitattributes",
  ".gitignore",
  ".pre-commit-config.yaml",
  "CLAUDE.md",
  # The single largest thing in the artifact by a wide margin -- about a megabyte, which was
  # most of the sdist. It pins sixteen *development* environments across four platforms,
  # including the Sphinx and PDF toolchain, none of which anybody rebuilding this package
  # uses: a build backend reads `pyproject.toml`, and a distributor resolves against their
  # own index. `pixi.toml` stays, because it is small and declarative and shows how the
  # project is developed; the resolved lock for that is a checkout's business.
  "pixi.lock",
]

# --- Ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples", "docs"]
# ruff formats Python inside Markdown fences. The pages under `docs/` carry examples whose
# exact text is pinned by `tests/**/test_documented_examples*.py`, so reflowing them here
# would silently move an assertion out from under its test. `docs/conf.py` is still checked.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RET", "C4", "PTH", "TID", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"examples/**" = ["S", "T201"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/sentrykit"]

# `cedarpy` ships no stubs. The framework packages are optional extras, so they are simply
# absent from the `default` environment -- and `pixi run typecheck` has to stay green there,
# because the core must remain type-checkable without any integration installed. In the `web`
# and `agent` environments the real packages are found and these overrides do nothing.
# The MCP integration must subclass ``mcp.shared.exceptions.MCPError``: it is the one exception
# mcp re-raises rather than swallowing, which is what lets a refusal leave a tool body carrying
# its envelope. In an environment without the ``mcp`` extra that base resolves to
# ``Any``, and strict mode refuses to subclass ``Any`` -- so the check is environment-dependent
# noise here rather than signal. It stays on everywhere else, including for this module in the
# ``agent`` and ``all`` environments, where the real class is found.
[[tool.mypy.overrides]]
module = ["sentrykit.integrations.mcp"]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = [
  "cedarpy.*",
  "fastapi.*",
  "flask.*",
  "mcp.*",
  "mcp_types.*",
  "pydantic_ai.*",
  "starlette.*",
  "werkzeug.*",
]
ignore_missing_imports = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
# The repo root, so `tests/` can import the example apps under `examples/`. The examples are
# part of the test surface (testing-standards) but are not an installed distribution.
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "unit: fast, isolated, no network or real frameworks",
  "integration: exercises a real framework/agent adapter",
  "scenario: end-to-end policy-pattern scenarios",
]

# --- coverage ---------------------------------------------------------------
[tool.coverage.run]
source = ["sentrykit"]
branch = true

[tool.coverage.report]
show_missing = true
# The floor is enforced by `scripts/coverage_gate.py`, not here. `--cov=sentrykit` reports every
# module in the package including ones this environment cannot import, and three of the four
# pixi environments deliberately install only some of the optional extras -- so a single number
# taken off this report means something different in each of them. The script applies the floor
# over the modules that could actually be imported, and says which it skipped and why.
fail_under = 0
