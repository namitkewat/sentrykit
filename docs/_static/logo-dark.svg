<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t d">
  <title id="t">sentrykit</title>
  <desc id="d">Three arguments reach a gate; two pass through and one is turned back.</desc>
  <g fill="none" stroke-width="6" stroke-linecap="round">
    <!-- the gate -->
    <path stroke="#818cf8" d="M40 7V57" />
    <!-- two arguments the principal may pass -->
    <path stroke="#2dd4bf" d="M8 18H48" />
    <path stroke="#2dd4bf" d="M8 46H48" />
    <!-- one they may not, refused short of the gate -->
    <path stroke="#fb7185" d="M8 32H26" />
  </g>
  <circle fill="#fb7185" cx="32" cy="32" r="4" />
</svg>
