# pixi manifest — dev environments + governance tasks.
# The `[workspace]` form below is confirmed against pixi 0.70.2 (see
# dev-docs/notes/phase-1-research.md). Older pixi versions used `[project]`.

[workspace]
name = "sentrykit"
version = "0.0.0"
description = "Lightweight, framework-agnostic authorization for Python web frameworks and agent tooling, built on AWS Cedar."
authors = ["Your Name <you@example.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.11,<3.14"
pip = "*"

# The package itself, installed editable so src/ edits are picked up live.
[pypi-dependencies]
sentrykit = { path = ".", editable = true }

# ---- Feature: core runtime (always on) -------------------------------------
[feature.core.pypi-dependencies]
cedarpy = ">=4.1"
pydantic = ">=2.7"
pydantic-settings = ">=2.2"
typing-extensions = ">=4.10"

# ---- Feature: web integrations ---------------------------------------------
[feature.web.pypi-dependencies]
fastapi = ">=0.110"
starlette = ">=0.37"
flask = ">=3.0"
httpx = ">=0.27"          # test client for FastAPI/Starlette
uvicorn = ">=0.29"

# ---- Feature: agent integrations -------------------------------------------
[feature.agent.pypi-dependencies]
mcp = ">=2,<3"
pydantic-ai = "*"
anyio = ">=4.3"

# ---- Feature: dev / test / docs --------------------------------------------
[feature.dev.pypi-dependencies]
pytest = ">=8.1"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5.0"
hypothesis = ">=6.100"
freezegun = ">=1.4"
ruff = ">=0.4"
mypy = ">=1.10"
pre-commit = ">=3.7"
build = ">=1.2"
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
mkdocstrings = { version = ">=0.25", extras = ["python"] }

[environments]
default = ["core", "dev"]
web = ["core", "web", "dev"]
agent = ["core", "agent", "dev"]
all = ["core", "web", "agent", "dev"]

# ---------------------------------------------------------------------------
# Governance tasks — run with `pixi run <name>` (add `-e web|agent|all` as needed).
# ---------------------------------------------------------------------------
[tasks]
# setup
setup = "pre-commit install --install-hooks && pre-commit install --hook-type commit-msg"
# quality gates
fmt = "ruff format src tests examples scripts"
fmt-check = "ruff format --check src tests examples scripts"
lint = "ruff check src tests examples scripts"
lint-fix = "ruff check --fix src tests examples scripts"
typecheck = "mypy src"
# tests
test = "pytest"
test-cov = "pytest --cov=sentrykit --cov-report=term-missing --cov-report=xml"
test-unit = "pytest -m unit tests/unit"
test-integration = "pytest -m integration tests/integration"
test-scenarios = "pytest -m scenario tests/scenarios"
# example apps (built in phases 3-4)
run-fastapi = "uvicorn examples.fastapi_app.main:app --reload"
run-flask = "flask --app examples.flask_app.main run --debug"
run-mcp = "python -m examples.fastmcp_server.server"
run-agent = "python -m examples.pydantic_ai_agent.agent"
# governance / ops (available once phase 5 CLI exists)
policy-validate = "python -m sentrykit.cli policy validate policy/"
audit-report = "python -m sentrykit.cli audit-report --from 2026-01-01 --to 2026-12-31 --out dist/audit-report.md"
# docs
docs = "mkdocs build --strict"
docs-serve = "mkdocs serve"
# aggregate
check = { depends-on = ["fmt-check", "lint", "typecheck", "test-cov", "docs"] }
ci = { depends-on = ["check"] }
build = "python -m build"
# `rm -rf` is unavailable on win-64, which is in the platform list above.
clean = "python scripts/clean.py"
