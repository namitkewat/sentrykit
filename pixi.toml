# pixi manifest — dev environments + governance tasks.
# The `[workspace]` form below is confirmed against pixi 0.70.2. Older pixi versions
# used `[project]`.

[workspace]
name = "sentrykit"
version = "0.1.0"
description = "Lightweight, framework-agnostic authorization for Python web frameworks and agent tooling, built on AWS Cedar."
authors = ["Namit Kewat <namitkewat@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.11,<3.14"
pip = "*"

# The package itself, installed editable so src/ edits are picked up live.
[pypi-dependencies]
sentrykit = { path = ".", editable = true }

# ---- Feature: core runtime (always on) -------------------------------------
[feature.core.pypi-dependencies]
cedarpy = ">=4.8,<5"
pydantic = ">=2.7"
pydantic-settings = ">=2.2"
typing-extensions = ">=4.10"

# ---- Feature: web integrations ---------------------------------------------
[feature.web.pypi-dependencies]
fastapi = ">=0.110"
starlette = ">=0.37"
flask = ">=3.0"
httpx = ">=0.27"          # test client for FastAPI/Starlette
uvicorn = ">=0.29"

# ---- Feature: agent integrations -------------------------------------------
[feature.agent.pypi-dependencies]
mcp = ">=2,<3"
pydantic-ai = "*"
anyio = ">=4.3"

# ---- Feature: the example apps' own data layer -----------------------------
# The examples query a seeded SQLite database so that a narrowed argument changes a real
# result set rather than a literal. That needs an ORM, and the ORM must not reach the
# library: `sentrykit` itself reads no database and `pyproject.toml` ships no such extra.
#
# It is a *feature* rather than a line in `dev` so the reason it exists is written where the
# dependency is, and it is attached to every environment because the documented-example tests
# import the example apps in all of them. Nothing in `src/` may import it -- the import scan
# in `tests/unit/test_core_imports.py` is what keeps that true.
[feature.demo.pypi-dependencies]
sqlalchemy = ">=2.0"

# ---- Feature: dev / test / docs --------------------------------------------
[feature.dev.pypi-dependencies]
pytest = ">=8.1"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5.0"
hypothesis = ">=6.100"
freezegun = ">=1.4"
ruff = ">=0.4"
mypy = ">=1.10"
pre-commit = ">=3.7"
build = ">=1.2"
# The build backend, present so `tests/integration/test_release_artifacts.py` can build the
# wheel with `--no-isolation`: offline, and about ten times faster. Without it that test
# falls back to an isolated build and skips wherever there is no index -- and a packaging
# check that skips is exactly how a wheel ships without its policy pack.
hatchling = ">=1.24"
# Docs. `sphinx>=9,<10` is the one pin that spans 3.11-3.13: 9.1 requires 3.12, so a 3.11
# environment resolves 9.0.x, and both are the same extension API and the same `-W`
# semantics. See dev-docs/notes/release-hardening-research.md.
sphinx = ">=9,<10"
myst-parser = ">=5"
furo = "*"
sphinx-autobuild = "*"
# Renders the *resolved* doctree to Markdown, so the autodoc'd API reference is expanded
# rather than left as a directive -- which is what makes llms-full.txt implementable-from.
sphinx-markdown-builder = ">=0.6.11"
# Pure-Python PDF: no LaTeX toolchain, identical on all four platforms and on a CI runner.
# AGPL-3.0-only, and confined to this dev feature: it is never imported by, linked into, or
# shipped inside the wheel, so it does not reach sentrykit's Apache-2.0 licensing. It must
# never be added to `[project.optional-dependencies]`.
rinohtype = ">=0.5.6"

# ---- Features: interpreter versions, for reproducing the CI matrix ----------
# Narrowed to linux-64 deliberately. These twelve environments exist so a contributor can
# reproduce a specific CI job locally; solving them for four platforms would quadruple the
# lock file to describe combinations nothing runs.
[feature.py311]
platforms = ["linux-64"]
[feature.py311.dependencies]
python = "3.11.*"

[feature.py312]
platforms = ["linux-64"]
[feature.py312.dependencies]
python = "3.12.*"

[feature.py313]
platforms = ["linux-64"]
[feature.py313.dependencies]
python = "3.13.*"

[environments]
# The four a developer types. Python floats to the newest the manifest allows.
default = ["core", "demo", "dev"]
web = ["core", "demo", "web", "dev"]
agent = ["core", "demo", "agent", "dev"]
all = ["core", "demo", "web", "agent", "dev"]
# The twelve the CI matrix runs: every feature set against every supported interpreter.
py311-default = ["py311", "core", "demo", "dev"]
py311-web = ["py311", "core", "demo", "web", "dev"]
py311-agent = ["py311", "core", "demo", "agent", "dev"]
py311-all = ["py311", "core", "demo", "web", "agent", "dev"]
py312-default = ["py312", "core", "demo", "dev"]
py312-web = ["py312", "core", "demo", "web", "dev"]
py312-agent = ["py312", "core", "demo", "agent", "dev"]
py312-all = ["py312", "core", "demo", "web", "agent", "dev"]
py313-default = ["py313", "core", "demo", "dev"]
py313-web = ["py313", "core", "demo", "web", "dev"]
py313-agent = ["py313", "core", "demo", "agent", "dev"]
py313-all = ["py313", "core", "demo", "web", "agent", "dev"]

# ---------------------------------------------------------------------------
# Governance tasks — run with `pixi run <name>` (add `-e web|agent|all` as needed).
# ---------------------------------------------------------------------------
[tasks]
# setup
setup = "pre-commit install --install-hooks && pre-commit install --hook-type commit-msg"
# quality gates
fmt = "ruff format src tests examples scripts docs"
fmt-check = "ruff format --check src tests examples scripts docs"
lint = "ruff check src tests examples scripts docs"
lint-fix = "ruff check --fix src tests examples scripts docs"
typecheck = "mypy src"
# tests
test = "pytest"
test-cov = "pytest --cov=sentrykit --cov-report=term-missing --cov-report=xml"
# Enforces the floor over the modules this environment can actually import; see the script.
coverage-gate = "python scripts/coverage_gate.py"
test-unit = "pytest -m unit tests/unit"
test-integration = "pytest -m integration tests/integration"
test-scenarios = "pytest -m scenario tests/scenarios"
# example apps
run-fastapi = "uvicorn examples.fastapi_app.main:serve --factory --reload"
run-flask = "flask --app examples.flask_app.main:serve run --debug"
run-mcp = "python -m examples.mcp_server.server"
run-agent = "python -m examples.pydantic_ai_agent.agent"
# The attack/defence suite. Needs no framework and no agent SDK, so it runs in `default`:
# the decision path is the core, and the core imports neither.
run-scenarios = "python -m examples.scenarios"
# governance / ops
# `policy validate` with no directory validates the *shipped* pack; point it at your own
# with `pixi run policy-validate ./policies`.
policy-validate = "python -m sentrykit.cli policy validate"
# The sink is named explicitly so the task runs out of the box against a dev log; in a
# deployment `SENTRYKIT_AUDIT_SINK` supplies it and the flag comes off.
audit-report = "python -m sentrykit.cli audit-report --from 2026-01-01 --to 2026-12-31 --sink jsonl://./dist/audit.jsonl --out dist/audit-report.md"

# ---- docs ------------------------------------------------------------------
# Source is `docs/`; every output lands under `dist/docs/` so the release workflow can
# attach assets by a path that does not move. See dev-docs/documentation-standards.md.
# `-d` puts each builder's doctree cache outside its output directory: Sphinx defaults to
# `<out>/.doctrees`, which would put 8 MB of pickled parse state inside the HTML tree the
# release zips and hands to a reader.
# `-W` on the HTML build only: it is the one that gates, and it gates in all four
# environments because `conf.py` mocks whichever framework packages are absent.
docs-html = "sphinx-build -W -b html -d dist/docs/.doctrees/html docs dist/docs/html"
# Pure-Python PDF (rinohtype). Deliberately not part of `check`: it is the slowest step by a
# wide margin, and a PDF that will not render blocks a release rather than a commit.
docs-pdf = "sphinx-build -b rinoh -d dist/docs/.doctrees/pdf docs dist/docs/pdf"
# Intermediate: the resolved doctree rendered to Markdown, which is what `docs-llms` reads.
# No `-W` -- the Markdown writer warns on nodes it has no spelling for, and none of them
# affect the text.
docs-markdown = "sphinx-build -b markdown -d dist/docs/.doctrees/markdown docs dist/docs/markdown"
docs-llms = { cmd = "python scripts/build_llms_txt.py", depends-on = ["docs-markdown"] }
docs = { depends-on = ["docs-html", "docs-pdf", "docs-llms"] }
docs-serve = "sphinx-autobuild docs dist/docs/html"
docs-clean = "python scripts/clean.py --docs"

# aggregate
check = { depends-on = ["fmt-check", "lint", "typecheck", "test-cov", "coverage-gate", "docs-html"] }
ci = { depends-on = ["check"] }
build = "python -m build"
# Needs the network: builds the artifacts and installs the wheel with each extra into a
# throwaway venv. The offline half of this check is tests/integration/test_release_artifacts.py.
release-check = "python scripts/release_check.py"
# `rm -rf` is unavailable on win-64, which is in the platform list above.
clean = "python scripts/clean.py"
