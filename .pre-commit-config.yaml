# Run `pixi run setup` once to install these (including the commit-msg gate).
minimum_pre_commit_version: "3.7.0"
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: ["pydantic>=2.7"]
        files: ^src/
  - repo: local
    hooks:
      - id: commit-message-policy
        name: commit message policy (conventional + no tooling attribution)
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
