# Run `pixi run setup` once to install these (including the commit-msg gate).
#
# Every hook runs the *pixi* toolchain rather than a pinned mirror, so pre-commit and
# `pixi run check` can never disagree about whether the tree is clean. The versions and the
# tool configuration live in one place (pixi.lock + pyproject.toml); a second, independently
# pinned copy here would drift and produce commits that pass locally and fail in CI.
minimum_pre_commit_version: "3.7.0"
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, autofix)
        entry: pixi run -e default lint-fix
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: ruff-format
        name: ruff (format)
        entry: pixi run -e default fmt
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: mypy
        name: mypy (strict)
        entry: pixi run -e default typecheck
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: commit-message-policy
        name: commit message policy (conventional + no tooling attribution)
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
